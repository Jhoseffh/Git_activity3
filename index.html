<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f4f7;
    }

    .login-container {
        width: 380px;
        padding: 40px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .login-container h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #333;
    }

    .login-container p {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: bold;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        outline: none;
    }

    .input-group input:focus {
        border-color: #4a90e2;
    }

    .login-button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #4a90e2;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-button:hover {
        background: #357abd;
    }

    .forgot-password {
        display: block;
        text-align: center;
        margin-top: 10px;
        margin-bottom: 20px;
        color: #4a90e2;
        text-decoration: none;
        font-size: 14px;
    }

    .signup {
        text-align: center;
        margin-top: 25px;
        color: #777;
        font-size: 14px;
    }

    .signup a {
        color: #4a90e2;
        text-decoration: none;
        font-weight: bold;
    }
</style>


</head>

<body>


<div class="login-container">
    <h1>Welcome</h1>
    <p>Login to your account</p>

    <form>
        <div class="input-group">
            <label for="email">Email</label>
            <input 
                type="email" 
                id="email" 
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Enter your password"
                required
            >
        </div>

        <a href="#" class="forgot-password">Forgot Password?</a>

        <button type="submit" class="login-button">
            Login
        </button>
    </form>

    <div class="signup">
        Don't have an account?
        <a href="#">Sign Up</a>
    </div>
</div>


</body>
</html>
