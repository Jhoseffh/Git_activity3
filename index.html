<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #141e30, #243b55);
    }

    .login-container {
        width: 400px;
        padding: 45px;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        animation: slideUp 0.8s ease;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(60px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .login-container h1 {
        text-align: center;
        margin-bottom: 8px;
        color: #1e293b;
        font-size: 32px;
    }

    .login-container p {
        text-align: center;
        color: #64748b;
        margin-bottom: 30px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-weight: bold;
    }

    .input-group input {
        width: 100%;
        padding: 14px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
    }

    .input-group input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        transform: translateY(-2px);
    }

    .options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #475569;
    }

    .remember-me input {
        width: 16px;
        height: 16px;
        accent-color: #6366f1;
    }

    .forgot-password {
        color: #6366f1;
        text-decoration: none;
        font-weight: bold;
    }

    .forgot-password:hover {
        text-decoration: underline;
    }

    .login-button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        position: relative;
        overflow: hidden;
    }

    .login-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
    }

    .login-button:active {
        transform: scale(0.97);
    }

    .login-button::after {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: rgba(255, 255, 255, 0.2);
        transform: skewX(-20deg);
        animation: shine 2.5s infinite;
    }

    @keyframes shine {
        0% {
            left: -100%;
        }
        50%, 100% {
            left: 150%;
        }
    }

    .signup {
        text-align: center;
        margin-top: 25px;
        color: #64748b;
        font-size: 14px;
    }

    .signup a {
        color: #6366f1;
        text-decoration: none;
        font-weight: bold;
    }

    .signup a:hover {
        text-decoration: underline;
    }
</style>


</head>

<body>

<div class="login-container">


<h1>Welcome Back!</h1>
<p>Please login to continue</p>

<form>

    <div class="input-group">
        <label for="email">Email Address</label>

        <input 
            type="email" 
            id="email" 
            placeholder="Enter your email"
            required
        >
    </div>

    <div class="input-group">
        <label for="password">Password</label>

        <input 
            type="password" 
            id="password" 
            placeholder="Enter your password"
            required
        >
    </div>

    <div class="options">

        <label class="remember-me">
            <input type="checkbox">
            Remember Me
        </label>

        <a href="#" class="forgot-password">
            Forgot Password?
        </a>

    </div>

    <button type="submit" class="login-button">
        Login
    </button>

</form>

<div class="signup">
    Don't have an account?
    <a href="#">Create an Account</a>
</div>


</div>

</body>
</html>
